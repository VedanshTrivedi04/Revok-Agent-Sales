[project]
name = "revops-ai"
version = "0.1.0"
description = "RevOps Agent AI/ML: LLM tasks (T1/T2/T3), validators, agent graph, evals, churn model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "joblib>=1.4",
  "langgraph>=1.2.14",
  "langgraph-checkpoint-postgres>=3.1.2",
  "psycopg[binary]>=3.3.6",
  "langfuse>=4.17.0",
  "fastapi>=0.143.0",
  "uvicorn[standard]>=0.54.0",
  "shap>=0.53.0",
  "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  "testcontainers[postgres]>=4.15.0",
  "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["revops_ai"]

[tool.ruff]
extend-exclude = ["*.ipynb", "models", "infra/cloud/make_colab_gguf_notebook.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC240"]
"revops_ai/fallback/*" = ["E501"]
"revops_ai/synth/*" = ["E501"]
"revops_ai/evidence/engine.py" = ["E501"]
"revops_ai/evals/*" = ["E501"]
"revops_ai/fixtures.py" = ["E501"]
"revops_ai/ml/*" = ["E501", "E731", "B023"]
"scripts/*" = ["ASYNC240", "ASYNC251", "E501", "B007"]
"revops_ai/validation/*" = ["E501"]
"revops_ai/graph/*" = ["E501"]
"revops_ai/worker.py" = ["E501"]
"revops_ai/service.py" = ["E501"]
"revops_ai/observability/*" = ["E501"]
"revops_ai/adapters/*" = ["E501"]
"revops_ai/llm/*" = ["E501"]
"revops_ai/evidence/*" = ["E501"]
"revops_ai/tasks/*" = ["E501"]
"revops_ai/domain.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "sklearn.*", "joblib.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "golden: golden dataset tests",
  "live: needs a running Qwen3.5-9B endpoint (LLM_BASE_URL)",
]
addopts = "-m 'not live'"

[[tool.mypy.overrides]]
module = ["revops_ai.graph.graph", "revops_ai.graph.runner"]
disable_error_code = ["call-overload", "misc", "arg-type", "type-arg"]

[[tool.mypy.overrides]]
module = ["revops_ai.observability.tracing", "langfuse.*", "langgraph.*"]
disable_error_code = ["attr-defined", "no-any-return", "arg-type", "no-any-unimported"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["revops_ai.ml.*", "revops_ai.service"]
disable_error_code = ["no-untyped-call", "no-any-return", "arg-type", "import-untyped", "call-overload", "assignment", "operator", "index", "misc", "attr-defined", "return-value"]

[[tool.mypy.overrides]]
module = ["shap.*", "matplotlib.*"]
ignore_missing_imports = true
