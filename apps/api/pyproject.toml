[project]
name = "revops-api"
version = "0.1.0"
description = "RevOps Agent API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "redis>=5.0",
  "structlog>=24.4",
  "sentry-sdk>=2.13",
  "alembic>=1.20.0",
  "psycopg[binary]>=3.3.6",
  "pyjwt>=2.15.1",
  "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["golden: golden dataset tests"]

[tool.ruff.lint.per-file-ignores]
"app/models/*" = ["E501"]
"app/mocks/*" = ["E501"]
"app/schemas/*" = ["E501"]
"scripts/*" = ["E501"]
"app/routes/*" = ["B008"]
"tests/*" = ["E501", "B008"]
"migrations/*" = ["E501", "I001"]

[[tool.mypy.overrides]]
module = "app.mocks.*"
disable_error_code = ["no-any-return", "var-annotated", "index", "arg-type", "no-untyped-call"]
