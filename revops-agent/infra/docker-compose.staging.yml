# Staging (mock mode): API + Postgres + Redis (+ Caddy for HTTPS when the `https` profile is on).
#   cp infra/.env.staging.example infra/.env.staging   # then edit secrets/domain
#   docker compose -f infra/docker-compose.staging.yml --env-file infra/.env.staging up -d --build
#   add `--profile https` on a VM with a public domain (Caddy gets the certificate automatically)
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      POSTGRES_DB: revops
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d revops"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: &api_env
      APP_ENV: staging
      MOCK_API: "false"
      REAL_ROUTERS: ${REAL_ROUTERS:-me,orgs,members,invites,api_keys,notifications,action_cards,autonomy,log,stream,integrations,oauth,field_mapping,ingest,accounts,entity_reviews,slack,admin,runs,today,findings,rules}
      SEED_ON_START: "true"
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/revops
      DATABASE_ADMIN_URL: postgresql+asyncpg://admin:admin@postgres:5432/revops
      DATABASE_MIGRATOR_URL: postgresql+psycopg://owner:${DB_OWNER_PASSWORD}@postgres:5432/revops
      REDIS_URL: redis://redis:6379/0
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET (shared with the web app)}
      API_JWT_AUDIENCE: revops-api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      TOKEN_ENC_KEYS: ${TOKEN_ENC_KEYS:?set TOKEN_ENC_KEYS (id:base64 32 bytes)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # template = deterministic explanations only; external = the `ai` service upgrades them
      AI_MODE: ${AI_MODE:-template}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8100}
    ports:
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
  # Celery worker + beat: syncs, account runs, card execution, digests and the hand-off to `ai`.
  worker:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *api_env
      SEED_ON_START: "false"
    entrypoint: []
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "sync,run,executor,notify,default", "-l", "info", "--concurrency", "4"]
  beat:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      <<: *api_env
      SEED_ON_START: "false"
    entrypoint: []
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
  # AI service (apps/ai): `--profile ai` and AI_MODE=external. Needs LLM_BASE_URL (model endpoint).
  ai:
    profiles: ["ai"]
    build: ../../apps/ai
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3.5-9B}
      LLM_STRUCTURED_MODE: ${LLM_STRUCTURED_MODE:-response_format}
      INTERNAL_API_URL: http://api:8000/internal
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [api]
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
volumes:
  pgdata:
  caddy_data:
